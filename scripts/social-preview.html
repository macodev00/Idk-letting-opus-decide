<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:640px;background:#0d1117;font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;color:#e6edf3;overflow:hidden}
  .wrap{display:flex;height:100%;align-items:center;padding:0 80px;gap:60px;box-sizing:border-box}
  .left{flex:1.1}
  h1{font-size:92px;margin:0 0 18px;letter-spacing:-2px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  h1 span{color:#3fb950}
  p{font-size:34px;line-height:1.3;margin:0 0 34px;color:#c9d1d9}
  .cmd{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:30px;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px 24px}
  .cmd b{color:#3fb950}
  .card{flex:.9;background:#161b22;border:1px solid #30363d;border-radius:18px;padding:30px 34px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:25px;line-height:1.75}
  .ok{color:#3fb950}.bad{color:#ff7b72}.warn{color:#d29922}.dim{color:#8b949e}
  .score{margin-top:14px;font-size:30px;font-weight:bold}
</style></head><body><div class="wrap">
  <div class="left">
    <h1>repo<span>-</span>ready</h1>
    <p>Is your repo ready for open&nbsp;source?<br>Find out in one command, and fix what's missing.</p>
    <div class="cmd"><b>$</b> npx repo-ready --fix</div>
  </div>
  <div class="card">
    <div><span class="ok">✔</span> LICENSE <span class="dim">(MIT)</span></div>
    <div><span class="ok">✔</span> README <span class="dim">(412 words)</span></div>
    <div><span class="ok">+</span> CONTRIBUTING.md</div>
    <div><span class="ok">+</span> SECURITY.md</div>
    <div><span class="ok">+</span> .github/workflows/ci.yml</div>
    <div><span class="bad">✖</span> GitHub token <span class="dim">app.js:3</span></div>
    <div><span class="warn">▲</span> 1 broken README link</div>
    <div class="score">Score: <span class="warn">74/100 (C)</span></div>
  </div>
</div></body></html>
